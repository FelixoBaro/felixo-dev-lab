            "56 15 14 8 *") COUNT=3 ;;
            *) COUNT=1 ;;
          esac
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
      - name: Create scheduled commits
        env:
          COUNT: ${{ steps.plan.outputs.count }}
        run: |
          git config user.name "barrfelix85"
          git config user.email "barrfelix85@gmail.com"
          for i in $(seq 1 "$COUNT"); do
            TS="$(date -u +"%Y-%m-%d %H:%M UTC")"
            FILE="scheduled/log-${TS//[: ]/-}-$i.txt"
            mkdir -p scheduled
            {
              echo "Scheduled contribution"
              echo "Timestamp: $TS"
              echo "Item $i of $COUNT"
              echo "Trigger: ${{ github.event.schedule }}"
            } > "$FILE"
            git add "$FILE"
            git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "Scheduled update $i/$COUNT ($TS)"
          done
          git push
